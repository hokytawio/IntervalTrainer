name: interval_trainer
description: Interval workout timer with voice cues (EN/PT) and a retro XP-inspired look.
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2   # local storage for presets, history, settings
  wakelock_plus: ^1.2.8        # keep the screen on during a workout
  vibration: ^3.2.1            # vibrate on phase changes

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/exercises/
